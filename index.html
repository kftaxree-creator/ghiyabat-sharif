<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>غیابات شەریف</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:20px;
}
h1{
    text-align:center;
    color:#2563eb;
}
table{
    width:100%;
    border-collapse:collapse;
    background:white;
}
th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}
th{
    background:#2563eb;
    color:white;
}
input{
    width:95%;
    padding:5px;
}
button{
    padding:10px 20px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>📋 غیابات شەریف</h1>

<table id="table">
<thead>
<tr>
<th>#</th>
<th>ناوی پلەیێر</th>
<th>بەروار</th>
<th>ئامادە</th>
<th>غایب</th>
</tr>
</thead>

<tbody id="body">

</tbody>

</table>

<br>

<button onclick="addRow()">➕ زیادکردنی پلەیێر</button>

<script>

let number=1;

function addRow(){

let tr=document.createElement("tr");

tr.innerHTML=`
<td>${number++}</td>
<td><input placeholder="ناوی پلەیێر"></td>
<td><input type="date"></td>
<td><input type="checkbox"></td>
<td><input type="checkbox"></td>
`;

document.getElementById("body").appendChild(tr);

}

for(let i=0;i<10;i++){
addRow();
}

</script>

</body>
</html>
