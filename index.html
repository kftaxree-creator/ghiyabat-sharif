<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 غیابات شەریف</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:white;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:20px;
color:#ff2020;
}

.card{
background:#161616;
padding:20px;
border-radius:15px;
box-shadow:0 0 20px rgba(255,0,0,.25);
}

</style>

</head>

<body>

<div class="container">

<h1>📋 غیابات شەریف</h1>

<div class="card">

<table id="table">

<thead>
<tr>
<th>#</th>
<th>👤 ناوی پلەیێر</th>
<th>📅 بەروار</th>
<th>✅ ئامادە</th>
<th>❌ غایب</th>
<th>💰 غەرامە ($)</th>
</tr>
</thead>

<tbody id="body">

</tbody>

</table>

<br>

<div class="buttons">

<button onclick="addRow()">➕ زیادکردنی پلەیێر</button>

<button onclick="removeRow()">➖ سڕینەوەی دوا پلەیێر</button>

<button onclick="saveData()">💾 Save</button>

</div>

<br>

<h2 id="totalFine">
💰 کۆی گشتی غەرامە: 0$
</h2>

</div>

</div>

</body>

</html>
<script>
  let number = 1;

function addRow(){

const tr = document.createElement("tr");

tr.innerHTML = `
<td>${number}</td>

<td><input type="text" class="player"></td>

<td><input type="date" class="date"></td>

<td><input type="checkbox" class="present"></td>

<td><input type="checkbox" class="absent"></td>

<td class="fine">0$</td>
`;

document.getElementById("body").appendChild(tr);

updateFine();

number++;

}
function updateFine(){

let total = 0;

document.querySelectorAll("#body tr").forEach(row=>{

const absent = row.querySelector(".absent");
const present = row.querySelector(".present");
const fine = row.querySelector(".fine");
function updateTotal(){

let total = 0;

document.querySelectorAll(".fine").forEach(f=>{

total += parseInt(f.innerHTML) || 0;

});

document.getElementById("totalFine").innerHTML =
"💰 کۆی گشتی غەرامە: " + total + "$";

} 
function saveData(){

localStorage.setItem("ghiyabat",document.getElementById("body").innerHTML);

}
window.onload = function(){

const data = localStorage.getItem("ghiyabat");

if(data){

document.getElementById("body").innerHTML = data;

}

updateFine();

updateTotal();

}
</script>
