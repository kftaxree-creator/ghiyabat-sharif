<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خشتەی غیاب</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f3f5f9;
padding:20px;
}

.box{
max-width:800px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px #ccc;
}

.logo{
width:110px;
display:block;
margin:auto;
}

h2{
text-align:center;
color:#0d6efd;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

th{
background:#0d6efd;
color:white;
}

input[type=text]{
width:95%;
padding:6px;
}

input[type=checkbox]{
transform:scale(1.4);
}

button{
margin-top:15px;
padding:10px 20px;
border:none;
border-radius:10px;
background:#198754;
color:white;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<img src="Kfta.PNG" class="logo">

<h2>خشتەی غیاب</h2>
<table id="table">
<tr>
<th>ژمارە</th>
<th>ناو</th>
<th>غیاب</th>
<th>غەرامە $</th>
</tr>

<tr>
<td>1</td>
<td><input type="text" id="name1"></td>
<td><input type="checkbox" id="abs1" onchange="updateFine(1)"></td>
<td id="fine1">0$</td>
</tr>

<tr>
<td>2</td>
<td><input type="text" id="name2"></td>
<td><input type="checkbox" id="abs2" onchange="updateFine(2)"></td>
<td id="fine2">0$</td>
</tr>

<tr>
<td>3</td>
<td><input type="text" id="name3"></td>
<td><input type="checkbox" id="abs3" onchange="updateFine(3)"></td>
<td id="fine3">0$</td>
</tr>

</table>

<h3>
کۆی غەرامە:
<span id="total">0$</span>
</h3>

<button onclick="saveData()">💾 Save</button>
<script>

function updateFine(i){

let fine=document.getElementById("fine"+i);

let check=document.getElementById("abs"+i);

if(check.checked){
fine.innerHTML="-5000$";
}else{
fine.innerHTML="0$";
}

let total=0;

for(let x=1;x<=3;x++){

if(document.getElementById("abs"+x).checked){
total-=5000;
}

}

document.getElementById("total").innerHTML=total+"$";

}

function saveData(){

for(let i=1;i<=3;i++){

localStorage.setItem("name"+i,
document.getElementById("name"+i).value);

localStorage.setItem("abs"+i,
document.getElementById("abs"+i).checked);

}

alert("Save بوو ✅");

}

window.onload=function(){

for(let i=1;i<=3;i++){

document.getElementById("name"+i).value=
localStorage.getItem("name"+i)||"";

document.getElementById("abs"+i).checked=
localStorage.getItem("abs"+i)=="true";

updateFine(i);

}

}

</script>

</div>
